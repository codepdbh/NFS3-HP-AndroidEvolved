plugins { id 'com.android.application' }
android {
    namespace 'com.nfsrecompiled.nfs3hp'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.nfsrecompiled.nfs3hp'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-dev'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DBUILD_NFS2=OFF', '-DBUILD_NFS3=ON', '-DWITH_PEDANTIC_FPU=OFF',
                    "-DSDL2_SOURCE_DIR=${file('../../vendor/SDL').absolutePath.replace('\\','/')}"
                targets 'nfs3hp', 'SDL2'
            }
        }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.30.5' } }
    sourceSets { main { java.srcDirs += '../../vendor/SDL/android-project/app/src/main/java' } }
    buildTypes { debug { debuggable true; jniDebuggable true } }
}
