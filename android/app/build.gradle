plugins { id 'com.android.application' }
android {
    namespace 'com.nfsrecompiled.nfs3hp'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.nfsrecompiled.nfs3hp'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                // -PoriginalExe builds the unpatched game instead of the Modern Patch.
                arguments '-DBUILD_NFS2=OFF', '-DBUILD_NFS3=ON', '-DWITH_PEDANTIC_FPU=OFF',
                    "-DNFS3_MODERN_PATCH=${project.hasProperty('originalExe') ? 'OFF' : 'ON'}",
                    "-DSDL2_SOURCE_DIR=${file('../../vendor/SDL').absolutePath.replace('\\','/')}"
                targets 'nfs3hp', 'SDL2'
            }
        }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.30.5' } }
    sourceSets { main { java.srcDirs += '../../vendor/SDL/android-project/app/src/main/java' } }
    buildTypes {
        debug { debuggable true; jniDebuggable true }
        // The recompiled game is ~85 MB of C++ that relies on inlining every
        // guest memory access; -O0 makes it unplayable. Release is the build to play.
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            signingConfig signingConfigs.debug
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
    }
}
